<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Deep indigo background gradient -->
    <radialGradient id="bg" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#1c2640"/>
      <stop offset="100%" stop-color="#070c18"/>
    </radialGradient>
    <!-- Star core glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5e6c8" stop-opacity="1"/>
      <stop offset="40%" stop-color="#e8b84b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e8b84b" stop-opacity="0"/>
    </radialGradient>
    <!-- Outer halo -->
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8b84b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#e8b84b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded background -->
  <rect width="32" height="32" rx="6" fill="url(#bg)"/>

  <!-- Van Gogh swirling arc layers — outer -->
  <g opacity="0.28">
    <path d="M 4,16 Q 5,8 16,5 Q 27,4 28,16" fill="none" stroke="#4a7ab5" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M 28,16 Q 27,24 16,27 Q 5,28 4,16" fill="none" stroke="#2a5298" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <!-- Mid swirl arcs -->
  <g opacity="0.38">
    <path d="M 7,16 Q 8,10 16,8 Q 24,7 25,16" fill="none" stroke="#7aaad4" stroke-width="1.1" stroke-linecap="round"/>
    <path d="M 25,16 Q 24,22 16,24 Q 8,25 7,16" fill="none" stroke="#4a7ab5" stroke-width="1.1" stroke-linecap="round"/>
  </g>

  <!-- Inner swirl arcs -->
  <g opacity="0.45">
    <path d="M 10,16 Q 11,12 16,11 Q 21,11 22,16" fill="none" stroke="#7aaad4" stroke-width="0.9" stroke-linecap="round"/>
    <path d="M 22,16 Q 21,20 16,21 Q 11,21 10,16" fill="none" stroke="#4a7ab5" stroke-width="0.9" stroke-linecap="round"/>
  </g>

  <!-- Outer halo glow around star -->
  <circle cx="16" cy="16" r="8" fill="url(#halo)"/>

  <!-- 8-point star — golden -->
  <g transform="translate(16,16)">
    <!-- Star rays (thin spikes) -->
    <polygon points="0,-7.2 0.7,-2.8 0,-1.6 -0.7,-2.8" fill="#e8b84b" opacity="0.9"/>
    <polygon points="0,7.2 0.7,2.8 0,1.6 -0.7,2.8" fill="#e8b84b" opacity="0.9"/>
    <polygon points="-7.2,0 -2.8,0.7 -1.6,0 -2.8,-0.7" fill="#e8b84b" opacity="0.9"/>
    <polygon points="7.2,0 2.8,0.7 1.6,0 2.8,-0.7" fill="#e8b84b" opacity="0.9"/>
    <!-- Diagonal rays -->
    <polygon points="-5.1,-5.1 -1.8,-1.8 -1.1,-2.5 -2.5,-1.1" fill="#e8b84b" opacity="0.72"/>
    <polygon points="5.1,-5.1 1.8,-1.8 2.5,-1.1 1.1,-2.5" fill="#e8b84b" opacity="0.72"/>
    <polygon points="-5.1,5.1 -1.8,1.8 -2.5,1.1 -1.1,2.5" fill="#e8b84b" opacity="0.72"/>
    <polygon points="5.1,5.1 1.8,1.8 1.1,2.5 2.5,1.1" fill="#e8b84b" opacity="0.72"/>
    <!-- Star core body -->
    <circle r="2.6" fill="#e8b84b"/>
    <!-- Inner bright core -->
    <circle r="1.4" fill="url(#glow)"/>
    <circle r="0.7" fill="#faf4e8"/>
  </g>

  <!-- Accent micro-stars -->
  <circle cx="5.5" cy="5.5" r="0.9" fill="#f5e6c8" opacity="0.7"/>
  <circle cx="26.5" cy="5.5" r="0.6" fill="#f5e6c8" opacity="0.55"/>
  <circle cx="5.5" cy="26.5" r="0.5" fill="#7aaad4" opacity="0.6"/>
  <circle cx="26.5" cy="26.5" r="0.8" fill="#f5e6c8" opacity="0.5"/>
  <circle cx="16" cy="3.5" r="0.5" fill="#e8b84b" opacity="0.4"/>
  <circle cx="3.5" cy="16" r="0.5" fill="#e8b84b" opacity="0.35"/>
  <circle cx="28.5" cy="16" r="0.4" fill="#7aaad4" opacity="0.45"/>
</svg>
