<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Soft Giverny morning sky-water gradient -->
    <linearGradient id="pond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4dde8"/>
      <stop offset="42%" stop-color="#9ac4b8"/>
      <stop offset="100%" stop-color="#5a8c78"/>
    </linearGradient>
    <!-- Bloom centre glow -->
    <radialGradient id="bloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8d0" stop-opacity="1"/>
      <stop offset="60%" stop-color="#f5d87a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e8b84b" stop-opacity="0"/>
    </radialGradient>
    <!-- Water shimmer overlay -->
    <radialGradient id="shimmer" cx="40%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#d4eef4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5a8c78" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded background — Giverny pond water -->
  <rect width="32" height="32" rx="6" fill="url(#pond)"/>
  <!-- Sky shimmer -->
  <rect width="32" height="32" rx="6" fill="url(#shimmer)"/>

  <!-- Water ripple lines — horizontal Monet brushstrokes -->
  <g opacity="0.28">
    <path d="M2,10 Q8,9 16,10 Q24,11 30,10" fill="none" stroke="#a4c4b4" stroke-width="0.9" stroke-linecap="round"/>
    <path d="M3,14 Q10,13 16,14 Q22,15 29,14" fill="none" stroke="#7abcac" stroke-width="0.7" stroke-linecap="round"/>
    <path d="M4,22 Q10,21 16,22 Q22,23 28,22" fill="none" stroke="#a4c4b4" stroke-width="0.7" stroke-linecap="round"/>
    <path d="M2,26 Q8,25.2 16,26 Q24,26.8 30,26" fill="none" stroke="#7abcac" stroke-width="0.6" stroke-linecap="round"/>
  </g>

  <!-- Lily pad 1 — main, centre-left -->
  <ellipse cx="13" cy="20" rx="7.5" ry="3.2" fill="#3a7050" opacity="0.88"/>
  <!-- Pad notch (V-cut) -->
  <path d="M13,20 L13,17" stroke="#264e34" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>
  <!-- Pad mid-rib -->
  <path d="M5.8,20 Q13,19.2 20.2,20" fill="none" stroke="#264e34" stroke-width="0.5" opacity="0.35"/>

  <!-- Lily pad 2 — small, bottom-right -->
  <ellipse cx="23" cy="25" rx="4.5" ry="1.9" fill="#305a40" opacity="0.75"/>
  <path d="M23,25 L23,23.2" stroke="#264e34" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>

  <!-- Lily pad 3 — small, top-left -->
  <ellipse cx="7" cy="12" rx="3.8" ry="1.6" fill="#3e6e40" opacity="0.6"/>

  <!-- Water lily bloom — 8 outer petals -->
  <g transform="translate(13,16)">
    <ellipse cx="0" cy="-4.2" rx="1.8" ry="2.8" fill="rgba(238,195,210,0.9)" transform="rotate(0)"/>
    <ellipse cx="0" cy="-4.2" rx="1.8" ry="2.8" fill="rgba(238,195,210,0.88)" transform="rotate(45)"/>
    <ellipse cx="0" cy="-4.2" rx="1.8" ry="2.8" fill="rgba(238,195,210,0.85)" transform="rotate(90)"/>
    <ellipse cx="0" cy="-4.2" rx="1.8" ry="2.8" fill="rgba(238,195,210,0.88)" transform="rotate(135)"/>
    <ellipse cx="0" cy="-4.2" rx="1.8" ry="2.8" fill="rgba(245,215,225,0.9)" transform="rotate(180)"/>
    <ellipse cx="0" cy="-4.2" rx="1.8" ry="2.8" fill="rgba(245,215,225,0.85)" transform="rotate(225)"/>
    <ellipse cx="0" cy="-4.2" rx="1.8" ry="2.8" fill="rgba(245,215,225,0.88)" transform="rotate(270)"/>
    <ellipse cx="0" cy="-4.2" rx="1.8" ry="2.8" fill="rgba(238,195,210,0.82)" transform="rotate(315)"/>
    <!-- Inner petals — lighter -->
    <ellipse cx="0" cy="-2.6" rx="1.1" ry="1.9" fill="rgba(255,232,240,0.92)" transform="rotate(22.5)"/>
    <ellipse cx="0" cy="-2.6" rx="1.1" ry="1.9" fill="rgba(255,232,240,0.9)" transform="rotate(67.5)"/>
    <ellipse cx="0" cy="-2.6" rx="1.1" ry="1.9" fill="rgba(255,232,240,0.92)" transform="rotate(112.5)"/>
    <ellipse cx="0" cy="-2.6" rx="1.1" ry="1.9" fill="rgba(255,232,240,0.9)" transform="rotate(157.5)"/>
    <ellipse cx="0" cy="-2.6" rx="1.1" ry="1.9" fill="rgba(255,232,240,0.92)" transform="rotate(202.5)"/>
    <ellipse cx="0" cy="-2.6" rx="1.1" ry="1.9" fill="rgba(255,232,240,0.9)" transform="rotate(247.5)"/>
    <ellipse cx="0" cy="-2.6" rx="1.1" ry="1.9" fill="rgba(255,232,240,0.92)" transform="rotate(292.5)"/>
    <ellipse cx="0" cy="-2.6" rx="1.1" ry="1.9" fill="rgba(255,232,240,0.9)" transform="rotate(337.5)"/>
    <!-- Stamen glow halo -->
    <circle r="2.4" fill="url(#bloom)"/>
    <!-- Stamen centre -->
    <circle r="1.4" fill="#f5d87a" opacity="0.95"/>
    <circle r="0.7" fill="#fff8d0"/>
  </g>

  <!-- Accent willow micro-strokes top -->
  <path d="M28,3 Q26,8 25,12" fill="none" stroke="#48866e" stroke-width="0.8" stroke-linecap="round" opacity="0.45"/>
  <path d="M30,4 Q28,9 27,13" fill="none" stroke="#5a8c78" stroke-width="0.6" stroke-linecap="round" opacity="0.35"/>

  <!-- Small accent dots (pollen / iris reflections) -->
  <circle cx="4.5" cy="5.5" r="0.8" fill="#8870a8" opacity="0.55"/>
  <circle cx="26" cy="7" r="0.6" fill="#a4c4b4" opacity="0.65"/>
  <circle cx="27" cy="27" r="0.7" fill="#8870a8" opacity="0.45"/>
  <circle cx="5" cy="27" r="0.5" fill="#7abcac" opacity="0.55"/>
</svg>
